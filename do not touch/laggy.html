<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eeeeeeeeeeeeeeeeeee</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            font-family: sans-serif;
            z-index: 10;
        }
        button {
            background: #ff3333;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #ff0000;
        }
    </style>
</head>
<body>

    <div id="controls">
        <h3>dt</h3>
        <p>dont run at maximim brightness</p>
        <button id="startButton">START </button>
    </div>

    <canvas id="drainCanvas"></canvas>

    <script>
        const canvas = document.getElementById('drainCanvas');
        const ctx = canvas.getContext('2d');
        const startButton = document.getElementById('startButton');
        const controls = document.getElementById('controls');

        let isRunning = false;
        let balls = [];
        const BALL_COUNT = 1500; // High count for heavy CPU/GPU physics
        const CHECKER_SIZE = 20;
        let flashToggle = false;

        // Resize canvas to full screen
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Initialize physics particles
        function initPhysics() {
            for (let i = 0; i < BALL_COUNT; i++) {
                balls.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    radius: Math.random() * 6 + 3,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`
                });
            }
        }

        // Heavy math calculations to drain CPU
        function heavyMath() {
            let total = 0;
            // Intentional heavy, unoptimized cryptographic loop
            for (let i = 0; i < 200000; i++) {
                total += Math.sin(i) * Math.cos(i) * Math.tan(i);
                total = Math.sqrt(Math.abs(total));
            }
            return total;
        }

        // Background Web Workers for multi-core CPU drain
        function launchCPUWorkers() {
            const workerCode = `
                self.onmessage = function() {
                    while(true) {
                        Math.random() * Math.random();
                    }
                }
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            const workerUrl = URL.createObjectURL(blob);
           
            // Spawn workers based on available CPU cores
            const cores = navigator.hardwareConcurrency || 4;
            for (let i = 0; i < cores; i++) {
                const worker = new Worker(workerUrl);
                worker.postMessage('start');
            }
        }

        // Start Audio Context to drain power via speakers
        function startAudio() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
               
                // Oscillator 1
                const osc1 = audioCtx.createOscillator();
                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(15000, audioCtx.currentTime); // High frequency, less audible but high power
               
                // Oscillator 2
                const osc2 = audioCtx.createOscillator();
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(60, audioCtx.currentTime); // Low bass frequency
               
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); // Keep volume low to prevent ear damage
               
                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioCtx.destination);
               
                osc1.start();
                osc2.start();
            } catch (e) {
                console.log("Audio context blocked or unsupported");
            }
        }

        // Main Loop: Render Checkerboard & Physics
        function loop() {
            if (!isRunning) return;

            // 1. Force heavy background math execution
            heavyMath();

            // 2. Draw Flashing Checkerboard
            flashToggle = !flashToggle;
            const cols = Math.ceil(canvas.width / CHECKER_SIZE);
            const rows = Math.ceil(canvas.height / CHECKER_SIZE);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const isBlack = (r + c)%2 === 0;
                    // Invert colors rapidly every frame
                    if (flashToggle) {
                        ctx.fillStyle = isBlack ? '#000000' : '#ffffff';
                    } else {
                        ctx.fillStyle = isBlack ? '#ffffff' : '#000000';
                    }
                    ctx.fillRect(c * CHECKER_SIZE, r * CHECKER_SIZE, CHECKER_SIZE, CHECKER_SIZE);
                }
            }

            // 3. Process and Draw Heavy Physics Particles
            for (let i = 0; i < balls.length; i++) {
                let b = balls[i];
               
                // Update position
                b.x += b.vx;
                b.y += b.vy;
               
                // Wall collisions
                if (b.x - b.radius < 0 || b.x + b.radius > canvas.width) b.vx *= -1;
                if (b.y - b.radius < 0 || b.y + b.radius > canvas.height) b.vy *= -1;

                // N^2 complex checks: particle-to-particle distance tracking
                for (let j = i + 1; j < balls.length; j++) {
                    let b2 = balls[j];
                    let dx = b2.x - b.x;
                    let dy = b2.y - b.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                   
                    // Simple interaction calculation to consume CPU cycles
                    if (dist < 50) {
                        ctx.beginPath();
                        ctx.strokeStyle = b.color;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(b.x, b.y);
                        ctx.lineTo(b2.x, b2.y);
                        ctx.stroke();
                    }
                }

                // Render particles
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
            }

            requestAnimationFrame(loop);
        }

        // Event Listener to trigger script on user interaction
        startButton.addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                controls.style.display = 'none';
                initPhysics();
                startAudio();
                launchCPUWorkers();
                loop();
            }
        });
    </script>
</body>
</html>
